<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F12 实训解密 · 十六关</title>
<style>
  /* ============ 基础重置与动效系统 ============ */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    line-height:1.65;
    transition:background .35s ease,color .35s ease;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button,input{font:inherit}
  button{cursor:pointer}
  code,kbd,.mono{font-family:"Cascadia Mono","JetBrains Mono","Fira Code",Consolas,"SFMono-Regular",monospace}

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes blink{
    0%,49%{opacity:1}
    50%,100%{opacity:0}
  }
  @keyframes pulseLed{
    0%,100%{box-shadow:0 0 0 0 rgba(255,122,47,.65)}
    60%{box-shadow:0 0 0 7px rgba(255,122,47,0)}
  }

  #app{max-width:1060px;margin:0 auto;padding:34px 24px 104px;animation:fadeUp .3s ease both}

  .mobile-note{
    display:none;margin-bottom:20px;padding:11px 16px;font-size:13px;border-radius:8px;
    border:1px solid rgba(148,163,184,.28);background:rgba(30,41,59,.55);color:#cbd5e1;
    backdrop-filter:blur(8px);
  }
  @media (max-width:767px){
    .mobile-note{display:block}
    #app{padding:22px 16px 84px}
  }

  /* 自定义滚动条 */
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.32)}

  /* ============ 首页：策展级实训大厅 ============ */
  body[data-major="home"]{
    background-color:#0b0e14;color:#edf0f5;
    background-image:
      radial-gradient(ellipse 60% 45% at 14% 8%,rgba(37,99,235,.15),transparent 65%),
      radial-gradient(ellipse 55% 40% at 88% 85%,rgba(255,122,47,.10),transparent 65%),
      radial-gradient(rgba(255,255,255,.065) 1px,transparent 1px);
    background-size:100% 100%,100% 100%,24px 24px;
    background-attachment:fixed;
  }

  .home-hero{
    display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;
    padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.09);
  }
  .home-eyebrow{
    display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;
    padding:4px 11px;border-radius:999px;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
    font:11px/1.2 "Cascadia Mono",Consolas,monospace;letter-spacing:.14em;color:#94a3b8;
  }
  .home-eyebrow i{width:6px;height:6px;border-radius:50%;background:#38f294;box-shadow:0 0 8px #38f294}
  .home-hero h1{
    margin:0;font-size:34px;font-weight:750;letter-spacing:-.01em;line-height:1.18;
    background:linear-gradient(135deg,#ffffff 0%,#cbd5e1 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .home-lead{margin:14px 0 0;max-width:620px;font-size:15px;color:#9ca6b8;line-height:1.8}

  .home-meter{
    display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:12px;
    border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  .meter-ring{position:relative;width:46px;height:46px;flex-shrink:0}
  .meter-ring svg{width:46px;height:46px;transform:rotate(-90deg)}
  .meter-ring .track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3.5}
  .meter-ring .fill{fill:none;stroke:#38f294;stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset .4s ease}
  .meter-ring span{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:11px/1 "Cascadia Mono",Consolas,monospace;color:#e2e8f0;
  }
  .meter-info{display:flex;flex-direction:column;gap:4px}
  .meter-info strong{font:13.5px/1.2 "Cascadia Mono",Consolas,monospace;color:#f1f5f9}
  .meter-info span{font-size:12px;color:#7f8a9c}

  .reset-bar{
    display:none;margin-top:16px;padding:12px 16px;border-radius:10px;
    border:1px solid rgba(239,68,68,.38);background:rgba(127,29,29,.22);
    color:#fecaca;font-size:13px;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .reset-bar.show{display:flex;animation:fadeUp .2s ease}
  .reset-bar button{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;font-size:12px}
  .reset-bar .danger{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:600}

  .portal-grid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:28px;
  }
  @media (max-width:740px){.portal-grid{grid-template-columns:1fr}}

  .portal{
    position:relative;display:flex;flex-direction:column;justify-content:space-between;
    min-height:232px;padding:26px 24px 22px;border-radius:14px;border:1px solid;
    text-align:left;overflow:hidden;
    transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s ease,border-color .24s ease;
  }
  .portal:hover{transform:translateY(-4px)}
  .portal:active{transform:translateY(-1px)}
  .portal-art{
    position:absolute;right:-8px;bottom:-10px;width:154px;height:154px;
    pointer-events:none;opacity:.16;transition:transform .35s ease,opacity .25s ease;
  }
  .portal:hover .portal-art{transform:scale(1.06) rotate(-2deg);opacity:.26}

  .portal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
  .portal .tag{
    font:11px/1 "Cascadia Mono",Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;
    padding:4px 8px;border-radius:4px;
  }
  .portal .enter-hint{
    font:11.5px/1 "Cascadia Mono",Consolas,monospace;opacity:.55;
    transition:transform .2s ease,opacity .2s ease;
  }
  .portal:hover .enter-hint{opacity:1;transform:translateX(3px)}

  .portal-body{position:relative;z-index:1;margin:16px 0 22px}
  .portal h2{margin:0 0 6px;font-size:23px;font-weight:750;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
  .portal .panel-name{font:12px/1.4 "Cascadia Mono",Consolas,monospace;opacity:.75}
  .portal .desc{margin:12px 0 0;font-size:13.8px;line-height:1.7;max-width:88%;opacity:.88}

  .portal .foot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;border-top:1px solid rgba(255,255,255,.09)}
  .pips{display:flex;gap:6px}
  .pips i{display:block;width:28px;height:5px;border-radius:99px;background:currentColor;opacity:.18;transition:opacity .2s}
  .pips i.done{opacity:1}
  .portal .stat{font:12px/1 "Cascadia Mono",Consolas,monospace;font-weight:600}

  /* 首页四张高质感入口卡 */
  .portal[data-th="el"]{
    background:
      linear-gradient(155deg,rgba(19,59,107,.96) 0%,rgba(8,25,48,.98) 100%);
    color:#eef6ff;border-color:rgba(96,165,250,.38);
    box-shadow:0 12px 32px rgba(4,16,34,.45),inset 0 1px 0 rgba(255,255,255,.12);
  }
  .portal[data-th="el"]::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
    background-size:22px 22px;
  }
  .portal[data-th="el"] .tag{background:rgba(244,201,93,.15);color:#f4c95d;border:1px solid rgba(244,201,93,.35)}
  .portal[data-th="el"]:hover{border-color:#f4c95d;box-shadow:0 18px 40px rgba(8,32,68,.65),0 0 0 1px rgba(244,201,93,.55)}
  .portal[data-th="el"] .stat{color:#f4c95d}
  .portal[data-th="el"] .pips i.done{background:#f4c95d;box-shadow:0 0 8px rgba(244,201,93,.5)}

  .portal[data-th="cn"]{
    background:
      radial-gradient(circle at 80% 15%,rgba(56,242,148,.12),transparent 55%),
      linear-gradient(160deg,#08110c 0%,#040806 100%);
    color:#4df5a2;border-color:rgba(45,160,102,.42);
    font-family:"Cascadia Mono",Consolas,monospace;
    box-shadow:0 12px 32px rgba(0,0,0,.55),inset 0 1px 0 rgba(77,245,162,.12);
  }
  .portal[data-th="cn"] .tag{background:rgba(56,242,148,.12);color:#5cf8ab;border:1px solid rgba(56,242,148,.3)}
  .portal[data-th="cn"]:hover{border-color:#38f294;box-shadow:0 18px 40px rgba(0,0,0,.65),0 0 28px rgba(56,242,148,.18)}
  .portal[data-th="cn"] .cursor{display:inline-block;width:10px;height:20px;background:#38f294;animation:blink 1.1s steps(1) infinite}
  .portal[data-th="cn"] .pips i.done{background:#38f294;box-shadow:0 0 8px rgba(56,242,148,.6)}

  .portal[data-th="so"]{
    background:
      radial-gradient(circle at 15% 15%,rgba(157,140,255,.14),transparent 55%),
      linear-gradient(160deg,#191c2b 0%,#121420 100%);
    color:#e9ecfa;border-color:rgba(139,124,246,.32);
    box-shadow:0 12px 32px rgba(7,8,18,.5),inset 0 1px 0 rgba(255,255,255,.08);
  }
  .portal[data-th="so"] .tag{background:rgba(167,139,250,.15);color:#c4b5fd;border:1px solid rgba(167,139,250,.32)}
  .portal[data-th="so"]:hover{border-color:#a78bfa;box-shadow:0 18px 42px rgba(10,10,24,.7),0 0 28px rgba(167,139,250,.18)}
  .portal[data-th="so"] .stat{color:#c4b5fd}
  .portal[data-th="so"] .pips i.done{background:#a78bfa;box-shadow:0 0 8px rgba(167,139,250,.55)}

  .portal[data-th="ne"]{
    background:
      radial-gradient(circle at 85% 20%,rgba(255,122,47,.12),transparent 55%),
      linear-gradient(160deg,#191d22 0%,#111418 100%);
    color:#f0ede7;border-color:rgba(255,122,47,.28);
    box-shadow:0 12px 32px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.06);
  }
  .portal[data-th="ne"] .tag{background:rgba(255,122,47,.14);color:#ff944d;border:1px solid rgba(255,122,47,.32)}
  .portal[data-th="ne"]:hover{border-color:#ff7a2f;box-shadow:0 18px 40px rgba(0,0,0,.68),0 0 26px rgba(255,122,47,.16)}
  .portal[data-th="ne"] .stat{color:#ff944d}
  .portal[data-th="ne"] .pips i.done{background:#ff7a2f;box-shadow:0 0 8px rgba(255,122,47,.55)}

  .home-foot{
    margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07);
    font-size:12.5px;color:#737e91;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }

  /* ============ 通用按钮与交互部件 ============ */
  .ghost-btn{
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.22);color:inherit;
    padding:7px 14px;border-radius:7px;font-size:12.5px;opacity:.88;
    transition:all .16s ease;
  }
  .ghost-btn:hover{opacity:1;background:rgba(255,255,255,.09);border-color:currentColor}
  .ghost-btn:disabled{opacity:.35;cursor:not-allowed}

  .submit-row{display:flex;gap:10px;align-items:stretch;margin-top:18px;flex-wrap:wrap}
  .ans-input{
    flex:1;min-width:220px;padding:12px 14px;border:1px solid;border-radius:8px;
    background:rgba(0,0,0,.22);color:inherit;
    font:14px/1.2 "Cascadia Mono",Consolas,monospace;letter-spacing:.04em;
    transition:border-color .16s,box-shadow .16s;
  }
  .ans-input:focus{outline:none;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
  .primary-btn{
    padding:12px 22px;border:1px solid;border-radius:8px;font-size:13.5px;font-weight:700;
    letter-spacing:.04em;transition:transform .14s ease,filter .14s ease,box-shadow .16s ease;
  }
  .primary-btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
  .primary-btn:active:not(:disabled){transform:translateY(0)}
  .primary-btn:disabled{opacity:.38;cursor:not-allowed}

  .hint-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .hint-item{
    padding:11px 14px;border:1px solid;border-radius:8px;font-size:13.5px;line-height:1.72;
    animation:fadeUp .2s ease;
  }
  .feedback{margin-top:12px;min-height:22px;font:13px/1.65 "Cascadia Mono",Consolas,monospace}
  .feedback.ok{color:#34d399}
  .feedback.err{color:#f87171}

  .debrief{
    display:none;margin-top:20px;padding:18px 20px;border:1px solid;border-left-width:4px;border-radius:10px;
  }
  .debrief.show{display:block;animation:fadeUp .25s ease}
  .debrief-title{
    display:flex;align-items:center;gap:8px;font:12px/1 "Cascadia Mono",Consolas,monospace;
    letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:8px;font-weight:700;
  }
  .debrief p{margin:0 0 16px;font-size:14.2px;line-height:1.78}

  .step-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .step-pill{
    padding:6px 13px;border:1px solid;border-radius:6px;background:transparent;color:inherit;
    font:12px/1.2 "Cascadia Mono",Consolas,monospace;opacity:.72;transition:all .16s ease;
  }
  .step-pill:hover:not(:disabled){opacity:1}
  .step-pill.active{opacity:1;font-weight:700}
  .step-pill.locked{opacity:.3;cursor:not-allowed}

  .ltitle{margin:8px 0 4px;font-size:24px;font-weight:750;letter-spacing:.01em}
  .lsub{font:12px/1.4 "Cascadia Mono",Consolas,monospace;opacity:.7;letter-spacing:.06em}
  .stage-btn{
    padding:9px 16px;border-radius:7px;border:1px solid currentColor;background:rgba(255,255,255,.04);color:inherit;
    font:13px/1.2 "Cascadia Mono",Consolas,monospace;transition:all .16s ease;
  }
  .stage-btn:hover:not(:disabled){background:rgba(255,255,255,.12);transform:translateY(-1px)}
  .stage-btn:disabled{opacity:.4;cursor:not-allowed}
  .stage-out{margin-top:12px;font:13px/1.65 "Cascadia Mono",Consolas,monospace;opacity:.92}

  /* =====================================================================
     大关一：Elements（建筑工程蓝图美学）
     ===================================================================== */
  body[data-major="el"]{
    background-color:#081c34;color:#eef6ff;
    background-image:
      radial-gradient(ellipse 70% 50% at 20% 0%,rgba(56,139,253,.18),transparent 65%),
      linear-gradient(rgba(147,197,253,.11) 1px,transparent 1px),
      linear-gradient(90deg,rgba(147,197,253,.11) 1px,transparent 1px),
      linear-gradient(rgba(147,197,253,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(147,197,253,.045) 1px,transparent 1px);
    background-size:100% 100%,100px 100px,100px 100px,20px 20px,20px 20px;
    background-attachment:fixed;
  }
  .bp-ruler{
    display:flex;justify-content:space-between;align-items:center;padding:6px 12px;margin-bottom:14px;
    border:1px solid rgba(147,197,253,.32);border-radius:6px;
    background:rgba(6,20,38,.82);
    font:10.5px/1 "Cascadia Mono",Consolas,monospace;color:#8bb9ef;letter-spacing:.1em;
  }
  .bp-sheet{
    position:relative;border:1.5px solid rgba(191,219,254,.55);border-radius:10px;
    background:rgba(9,28,52,.88);padding:26px 28px 30px;
    box-shadow:0 24px 60px rgba(2,10,24,.55),inset 0 0 0 5px rgba(8,28,52,.85),inset 0 0 0 6px rgba(147,197,253,.18);
    backdrop-filter:blur(6px);
  }
  .bp-corner{position:absolute;width:14px;height:14px;border-color:#f4c95d;pointer-events:none}
  .bp-corner.tl{top:-2px;left:-2px;border-top:2px solid;border-left:2px solid}
  .bp-corner.tr{top:-2px;right:-2px;border-top:2px solid;border-right:2px solid}
  .bp-corner.bl{bottom:-2px;left:-2px;border-bottom:2px solid;border-left:2px solid}
  .bp-corner.br{bottom:-2px;right:-2px;border-bottom:2px solid;border-right:2px solid}

  .bp-header{
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    padding-bottom:16px;border-bottom:1px dashed rgba(147,197,253,.35);
  }
  .bp-header h1{margin:4px 0 0;font-size:20px;font-family:"Cascadia Mono",Consolas,monospace}
  .bp-fig{font:11.5px/1 "Cascadia Mono",Consolas,monospace;color:#f4c95d;letter-spacing:.14em}
  .bp-stamp{
    display:flex;align-items:center;gap:12px;
  }
  .bp-scale{
    padding:4px 9px;border:1px solid rgba(244,201,93,.4);border-radius:4px;
    font:10.5px/1 "Cascadia Mono",Consolas,monospace;color:#f4c95d;background:rgba(244,201,93,.08);
  }
  body[data-major="el"] .step-pill{border-color:rgba(147,197,253,.38)}
  body[data-major="el"] .step-pill.active{background:#f4c95d;border-color:#f4c95d;color:#081c34;box-shadow:0 0 14px rgba(244,201,93,.35)}
  .bp-task{
    margin:16px 0;padding:15px 18px;border-left:3px solid #f4c95d;border-radius:0 8px 8px 0;
    background:rgba(147,197,253,.08);font-size:15px;line-height:1.82;
  }
  .bp-stage{
    margin:20px 0;padding:24px;border:1px solid rgba(147,197,253,.35);border-radius:10px;
    background:rgba(5,16,32,.78);position:relative;
  }
  body[data-major="el"] .ans-input{border-color:rgba(147,197,253,.48);background:rgba(5,16,32,.75)}
  body[data-major="el"] .ans-input:focus{border-color:#f4c95d;box-shadow:0 0 0 3px rgba(244,201,93,.22)}
  body[data-major="el"] .primary-btn{background:#f4c95d;border-color:#f4c95d;color:#081c34;box-shadow:0 6px 18px rgba(244,201,93,.22)}
  body[data-major="el"] .hint-item{border-color:rgba(244,201,93,.38);background:rgba(244,201,93,.08)}
  body[data-major="el"] .debrief{border-color:rgba(244,201,93,.55);background:rgba(244,201,93,.09)}

  /* Elements 拟真微场景卡片 */
  .paper-box{
    position:relative;max-width:460px;padding:22px;border-radius:10px;
    background:#f8fafc;color:#1e293b;border:1px solid #cbd5e1;
    box-shadow:0 12px 28px rgba(0,0,0,.3);overflow:hidden;
  }
  .paper-box h3{margin:0 0 10px;font-size:16.5px;color:#0f172a}
  .paper-box p{margin:7px 0;font-size:13.8px;line-height:1.72;color:#334155}
  .vip-mask{
    position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:9px;padding:18px;text-align:center;
    background:rgba(15,23,42,.92);backdrop-filter:blur(6px);color:#f8fafc;
  }
  .vip-mask .vip-badge{
    padding:4px 11px;border-radius:999px;border:1px solid #f4c95d;color:#f4c95d;
    font:11px/1 "Cascadia Mono",Consolas,monospace;letter-spacing:.12em;
  }
  .vip-toast{margin-top:12px;font:12.5px/1.5 "Cascadia Mono",Consolas,monospace;color:#f4c95d;min-height:19px}

  .legacy-form{
    max-width:400px;padding:20px;border-radius:10px;background:#f8fafc;color:#1e293b;
    border:1px solid #cbd5e1;box-shadow:0 12px 28px rgba(0,0,0,.28);
  }
  .legacy-form label{display:block;font-size:12px;font-weight:600;color:#475569;margin:10px 0 5px}
  .legacy-form input{width:100%;padding:9px 11px;border-radius:6px;border:1px solid #94a3b8;font-family:"Cascadia Mono",monospace;background:#fff}
  .legacy-form button{margin-top:14px;padding:9px 16px;border-radius:6px;border:none;background:#0f294a;color:#fff;font-weight:600}
  .legacy-form button:disabled{opacity:.42;cursor:not-allowed}

  .swatch-card{
    max-width:480px;padding:20px 22px;border-radius:10px;
    background:linear-gradient(145deg,#0f172a,#1e293b);border:1px solid #334155;
    box-shadow:0 12px 28px rgba(0,0,0,.32);
  }
  .price-card{
    max-width:460px;padding:20px 22px;border-radius:10px;background:#f8fafc;color:#1e293b;
    border:1px solid #cbd5e1;box-shadow:0 12px 28px rgba(0,0,0,.28);
  }
  .price-tag{font-size:24px;font-weight:800;color:#dc2626;margin:8px 0 4px}

  /* =====================================================================
     大关二：Console（高质感复古荧光终端）
     ===================================================================== */
  body[data-major="cn"]{
    background-color:#040806;color:#52f2a0;
    background-image:radial-gradient(ellipse 65% 45% at 50% 0%,rgba(42,209,129,.12),transparent 70%);
    font-family:"Cascadia Mono",Consolas,monospace;
    background-attachment:fixed;
  }
  body[data-major="cn"]::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:99;

  /* ==================== 工具函数：防剧透哈希与安全存储 ==================== */
  const STORE_KEY = 'f12_lab_prog_v2';

  function norm(s) {
    return String(s || '').trim().toLowerCase().replace(/\s+/g, '');
  }

  function digest(str) {
    const s = 'f12lab::2026::' + norm(str);
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < s.length; i++) {
      const ch = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
  }

          prog[k] = parsed[k];

      const val = String(rawVal || '');
      if (!val.trim()) return false;
      const h = digest(val);
      if (s.hashes.includes(h)) {
        fb.className = 'feedback ok';
        fb.textContent = '验证通过。';
        if (prog[id] < idx + 1) {
          prog[id] = idx + 1;

        nextBtn.textContent = isLast ? '完成本大关，返回大厅' : `进入下一关（${idx + 2} / ${m.subs.length}）`;
        nextBtn.onclick = () => {
          location.hash = isLast ? '#home' : `#${id}/${idx + 1}`;

      fb.className = 'feedback err';
      if (/^["'].*["']$/.test(val.trim())) {
        fb.textContent = '口令外层多带了引号，去掉引号再提交试试。';
      } else if (typeof s.diagnose === 'function' && s.diagnose(val)) {
        fb.textContent = s.diagnose(val);
      } else {

  function route() {
    const h = (location.hash || '').replace(/^#/, '');
    const m = /^(el|cn|so|ne)(?:\/(\d+))?$/.exec(h);
    if (m) {
      const id = m[1];
      const idx = m[2] !== undefined ? Number(m[2]) : Math.min(prog[id], 3);
      renderLevel(id, idx);
    } else {
      renderHome();
    }
  }

  loadProg();
  window.addEventListener('hashchange', route);
  window.addEventListener('load', route);
})();
</script>
</body>
